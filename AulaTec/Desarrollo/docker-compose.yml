services:
  mysql_db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fichaje
    ports:
      - "3306:3306" 

  laravel-docker:
    container_name: laravel-docker
    build: .
    volumes:
      - ./AulaTec:/var/www/html
    ports:
      - "9000:80"
    depends_on:
      - mysql_db
           
  phpmyadmin:
    image: phpmyadmin:5.2.1
    ports:
      - "9001:80"
    environment:
      PMA_HOST: mysql_db
      PMA_USER: root
      PMA_PASSWORD: root